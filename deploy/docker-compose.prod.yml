# Production: Postgres + the API + Caddy, on any machine with a public IP and a DNS name pointing
# at it (ports 80 and 443 open). Caddy serves the web app at https://<domain>/ and the API at
# https://<domain>/api, with an automatic Let's Encrypt certificate. Nothing else is published.
# From the repo root, with a filled-in .env (copy deploy/.env.example):
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
name: tea
services:
  db:
    image: postgres:16
    env_file: ../.env                   # POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: tea
      POSTGRES_USER: tea
    volumes: [ "db:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tea -d tea"], interval: 5s, retries: 10 }
    restart: unless-stopped
  app:
    build: { context: .., dockerfile: deploy/Dockerfile, target: server }
    env_file: ../.env                   # PUBLIC_URL, DATABASE_PASSWORD, SMTP_*, secrets
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/tea
      DATABASE_USER: tea
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    env_file: ../.env                   # PUBLIC_URL (the Caddy site address)
    ports: [ "80:80", "443:443", "443:443/udp" ]
    volumes: [ "caddy-data:/data", "caddy-config:/config" ]
    depends_on: [ app ]
    restart: unless-stopped
volumes: { db: {}, caddy-data: {}, caddy-config: {} }
