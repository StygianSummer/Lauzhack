name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # GitHub runners set ANDROID_HOME, which would switch the Android build on (settings.gradle.kts).
      # Tests don't need it: keep this job identical to a machine without an SDK.
      - name: Shared + server tests
        run: ./gradlew -Ptea.android=false :shared:allTests :server:test --console=plain
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            server/build/reports/tests/

  # Plan §16.10 "Android shell builds". Non-blocking until it has been green on GitHub once.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the Android platform the build compiles against
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Build the debug APK
        run: ./gradlew -Ptea.android=true :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: thisistea-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
